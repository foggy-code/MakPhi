[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioloom"
version = "4.1.0"
description = "BioLoom v4 - suite per la modellazione di proteine per omologia"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "biopython>=1.83",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bioloom = "bioloom.__main__:main"

[tool.setuptools.packages.find]
include = ["bioloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modeller: test che richiedono MODELLER installato (lenti)",
    "network: test che richiedono accesso a servizi remoti",
]
addopts = "-m 'not network'"
