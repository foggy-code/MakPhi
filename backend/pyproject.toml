[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioloom"
version = "4.1.0"
description = "BioLoom v4 - suite per la modellazione di proteine per omologia"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "biopython>=1.83",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
bioloom = "bioloom.__main__:main"

[tool.setuptools.packages.find]
include = ["bioloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modeller: test che richiedono MODELLER installato (lenti)",
    "network: test che richiedono accesso a servizi remoti",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Errori reali (sintassi, nomi, import) e bug comuni. Esclusi: B008 (Depends() di FastAPI nei default),
# B904 (i messaggi AppError sostituiscono volutamente l'eccezione originale), B905 (zip senza strict).
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B904", "B905"]
