# Integrazione continua di BioLoom v4.
# - backend: versione unica (programma/scripts/versione.sh), impronta del codice uguale in sh e in PowerShell
#   (docker/impronta.sh, launcher/impronta.ps1), lint e test rapidi in Python puro (senza MODELLER né strumenti
#   esterni: quei test vengono saltati)
# - frontend: eslint, typecheck, test con la copertura (riepilogo del job) e build dell'interfaccia
# - dipendenze: vulnerabilità note (pip-audit sui lock del backend, npm audit sulle dipendenze di produzione)
# - avviatori: shellcheck sugli script sh (livello warning), PSScriptAnalyzer sugli script PowerShell (solo errori) e
#   bit di esecuzione dei file .sh e .command nel repository
# - docker: costruzione dell'immagine completa e test al suo interno, come programma/scripts/test.sh in locale; l'immagine ha
#   fpocket, APBS, PDB2PQR, OpenMM e PDBFixer (versioni fissate nel Dockerfile e in programma/backend/requirements-tools.lock),
#   quindi qui girano anche i test di tasche, elettrostatica e rifinitura, saltati nel job backend.
#   PROCHECK e ProSA (pacchetti con licenza) non sono nel repository: l'immagine della CI ne è priva.
#   La chiave di MODELLER, se configurata come secret MODELLER_KEY, abilita i test di MODELLER.
#   I test nell'immagine misurano anche la copertura del backend (pytest-cov): il totale va nel riepilogo del job.
#   L'impronta salvata nell'immagine (/app/IMPRONTA) deve essere quella del codice da cui è costruita.
#   Poi l'avviatore vero (avvio, salute, arresto) e la copia portatile (prepara), avviata dal file in immagini/ dopo
#   aver tolto l'immagine da Docker, e l'avviatore dei server senza compose (launcher/bioloom-podman.sh) con il Podman
#   del runner, senza root. Infine l'interfaccia servita da BioLoom in Chromium (Playwright): ogni pagina in tema scuro
#   e chiaro senza errori in console e senza violazioni WCAG 2.1 gravi secondo axe-core (frontend/e2e/).
# - qmean: solo a mano (Run workflow con "qmean"), costruzione dell'immagine bioloom-qmean e prova del worker.
# Le GitHub Actions sono fissate per SHA completo del commit, con il tag nel commento: un tag spostato non cambia il
# codice che gira qui. Le aggiorna Dependabot (.github/dependabot.yml), che riscrive SHA e commento insieme; a mano:
# `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>' 'refs/tags/<tag>^{}'`: se c'è la riga che finisce
# con ^{} (tag annotato) il commit è quello, altrimenti è l'unica riga (con il solo nome del tag ls-remote non stampa ^{}).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qmean:
        description: "Costruisci anche l'immagine bioloom-qmean (l'immagine di base di QMEAN pesa circa 2 GB)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: programma/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versione unica
        working-directory: .
        run: bash programma/scripts/versione.sh
      - name: Impronta del codice (sh, sh senza perl, PowerShell)
        working-directory: .
        run: |
          a="$(sh programma/docker/impronta.sh programma)"
          b="$(IMPRONTA_SENZA_PERL=1 sh programma/docker/impronta.sh programma)"
          c="$(pwsh -NoProfile -Command '. ./programma/launcher/impronta.ps1; Get-BioLoomImpronta ./programma')"
          echo "sh:            $a"
          echo "sh senza perl: $b"
          echo "PowerShell:    $c"
          test -n "$a" && test "$a" = "$b" && test "$a" = "$c"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: programma/backend/requirements.lock
      # pytest-timeout come in pyproject.toml (dipendenze dev): applica il limite per test di [tool.pytest.ini_options]
      - run: pip install -r requirements.lock "pytest>=7" "pytest-timeout==2.4.0" "ruff>=0.6"
      - run: ruff check --config pyproject.toml . ../docker/qmean
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: programma/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: programma/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - name: Copertura dei test del frontend (riepilogo)
        run: |
          node -e '
            const t = require("./.coverage/coverage-summary.json").total;
            const riga = (n, k) => `| ${n} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Copertura del frontend (vitest, v8)", "", "| | % | coperte / totali |", "|---|---|---|",
              riga("Righe", "lines"), riga("Rami", "branches"), riga("Funzioni", "functions")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npx vite build

  dipendenze:
    # vulnerabilità note nelle dipendenze che finiscono nell'immagine: i lock del backend (pip-audit, banca dati PyPA
    # e OSV) e le dipendenze di produzione dell'interfaccia (npm audit, livello alto o critico). Le dipendenze di
    # sviluppo del frontend (vitest e simili) non entrano nell'immagine: il loro rapporto si stampa e basta.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit (requirements.lock e requirements-tools.lock)
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off --no-deps --disable-pip \
            -r programma/backend/requirements.lock -r programma/backend/requirements-tools.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (dipendenze di produzione dell'interfaccia)
        working-directory: programma/frontend
        run: |
          npm audit --omit=dev --audit-level=high
          echo "== dipendenze di sviluppo (solo rapporto)"
          npm audit || true

  avviatori:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (script sh e .command)
        run: |
          shellcheck --version | head -n2
          shellcheck -S warning programma/launcher/*.sh avvia-bioloom.sh programma/docker/*.sh programma/scripts/*.sh \
            programma/docker/qmean/tests/*.sh "Avvia BioLoom.command" "Arresta BioLoom.command"
      - name: PSScriptAnalyzer (script PowerShell, solo errori)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          "PSScriptAnalyzer " + (Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version
          $errori = Get-ChildItem programma/launcher/*.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error, ParseError
          }
          if ($errori) {
            $errori | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 200
            Write-Host "PSScriptAnalyzer: $(@($errori).Count) errori negli script PowerShell."
            exit 1
          }
      - name: Bit di esecuzione degli script (.sh, .command)
        run: |
          senza="$(git ls-files -s -- '*.sh' '*.command' | awk '$1 != "100755" { sub(/^[^\t]*\t/, ""); print }')"
          if [ -n "$senza" ]; then
            echo "Script senza il bit di esecuzione nel repository (git update-index --chmod=+x <file>):"
            echo "$senza"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Versione
        id: version
        run: echo "version=$(head -n1 programma/launcher/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Immagine BioLoom
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: programma
          file: programma/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bioloom:${{ steps.version.outputs.version }}
          build-args: BIOLOOM_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Impronta nell'immagine
        run: |
          immagine="$(docker run --rm --entrypoint cat bioloom:${{ steps.version.outputs.version }} /app/IMPRONTA)"
          codice="$(sh programma/docker/impronta.sh programma)"
          echo "immagine: $immagine"
          echo "codice:   $codice"
          test -n "$codice" && test "$immagine" = "$codice"
      - name: Test nell'immagine
        env:
          MODELLER_KEY: ${{ secrets.MODELLER_KEY }}
        run: programma/scripts/test.sh backend --cov --cov-report=term --cov-report=json:/src/backend/.coverage-backend.json
      - name: Copertura dei test del backend (riepilogo)
        run: |
          python3 - programma/backend/.coverage-backend.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          t = json.load(open(sys.argv[1]))["totals"]
          print("### Copertura del backend (pytest-cov, nell'immagine)\n")
          print(f"Righe: **{t['percent_covered']:.1f}%** ({t['covered_lines']} / {t['num_statements']})")
          PY
      - name: Avviatore (avvio, salute, arresto)
        timeout-minutes: 10
        env:
          VERSIONE: ${{ steps.version.outputs.version }}
        run: |
          # i test non devono aver toccato il codice: con un'impronta diversa "prepara" ricostruirebbe l'immagine
          test "$(sh programma/docker/impronta.sh programma)" = "$(docker run --rm --entrypoint cat "bioloom:$VERSIONE" /app/IMPRONTA)"
          ./avvia-bioloom.sh --no-menu --no-browser
          curl -fsS http://127.0.0.1:8765/api/health
          echo
          ./avvia-bioloom.sh arresta
      - name: Copia portatile (prepara, avvio dal file in immagini/, arresto)
        timeout-minutes: 30
        env:
          VERSIONE: ${{ steps.version.outputs.version }}
        run: |
          copia="$RUNNER_TEMP/copia BioLoom"
          ./avvia-bioloom.sh prepara "$copia" --no-menu --senza-qmean --senza-dati
          ls -l "$copia/immagini"
          test -s "$copia/immagini/bioloom-$VERSIONE.tar"
          # senza l'immagine in Docker la copia deve caricarla dal file in immagini/
          docker image rm "bioloom-test:bioloom-$VERSIONE" >/dev/null 2>&1 || true
          docker image rm "bioloom:$VERSIONE"
          if docker image inspect "bioloom:$VERSIONE" >/dev/null 2>&1; then echo "bioloom:$VERSIONE non tolta"; exit 1; fi
          "$copia/avvia-bioloom.sh" --no-menu --no-browser
          docker image inspect "bioloom:$VERSIONE" >/dev/null
          curl -fsS http://127.0.0.1:8765/api/health
          echo
          "$copia/avvia-bioloom.sh" arresta
      - name: Avviatore per Podman (avvio, salute, arresto)
        # come sul server senza compose (launcher/bioloom-podman.sh), con il Podman del runner, senza root: l'immagine
        # è quella appena provata, passata da Docker a Podman (la costruzione con Podman rifarebbe tutto)
        timeout-minutes: 15
        env:
          VERSIONE: ${{ steps.version.outputs.version }}
        run: |
          podman --version
          docker save "bioloom:$VERSIONE" | podman load
          # il primo avvio crea server.env (dati in data/, solo 127.0.0.1) e si ferma, il secondo avvia
          programma/launcher/bioloom-podman.sh avvia --no-menu
          test -f server.env
          programma/launcher/bioloom-podman.sh avvia --no-menu
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health; then ok=1; break; fi
            sleep 2
          done
          echo
          podman ps -a --filter name=bioloom
          test "$ok" = 1
          programma/launcher/bioloom-podman.sh arresta --no-menu
          test -z "$(podman ps -q --filter name=bioloom)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: programma/frontend/package-lock.json
      - name: Interfaccia in un browser vero (Playwright, axe-core)
        # dopo gli avviatori e la copia portatile: node_modules non deve finire nella copia
        timeout-minutes: 20
        run: |
          (cd programma/frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          ./avvia-bioloom.sh --no-menu --no-browser
          curl -fsS http://127.0.0.1:8765/api/health
          echo
          set +e
          (cd programma/frontend && npm run e2e)
          esito=$?
          set -e
          ./avvia-bioloom.sh arresta
          exit "$esito"
      - name: Container e log (se un passo non è riuscito)
        if: failure()
        run: |
          docker ps -a
          docker compose -p bioloom logs --tail 200 || true
          podman ps -a || true
          podman logs --tail 200 bioloom || true

  qmean:
    # solo a mano (Actions > CI > Run workflow, con "qmean"): l'immagine di base di QMEAN pesa circa 2 GB
    if: github.event_name == 'workflow_dispatch' && inputs.qmean
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Versione
        id: version
        run: echo "version=$(head -n1 programma/launcher/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Immagine QMEAN
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: programma/docker/qmean
          platforms: linux/amd64
          load: true
          tags: bioloom-qmean:${{ steps.version.outputs.version }}
      - name: Worker QMEAN (risponde anche senza database)
        timeout-minutes: 5
        run: |
          docker run -d --name qmean -p 127.0.0.1:8080:8080 bioloom-qmean:${{ steps.version.outputs.version }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/status && exit 0
            sleep 2
          done
          docker logs qmean
          exit 1
