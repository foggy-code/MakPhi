[build-system]
# setuptools 77 o successivo: license come espressione SPDX (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makphi"
version = "5.0.0"
description = "MakPhi - suite per la modellazione di proteine per omologia"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "biopython>=1.83",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout==2.4.0", "pytest-cov==7.0.0", "ruff>=0.6"]

[project.scripts]
makphi = "makphi.__main__:main"

[tool.setuptools.packages.find]
include = ["makphi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modeller: test che richiedono MODELLER installato (lenti)",
    "network: test che richiedono accesso a servizi remoti",
]
addopts = "-m 'not network'"
# come il filtro permanente di domain/structure.py, che pytest scarta a fine raccolta (catch_warnings): con più
# letture in parallelo il catch_warnings di load_structure, non sicuro fra thread, lascerebbe passare l'avviso
filterwarnings = ["ignore::Bio.PDB.PDBExceptions.PDBConstructionWarning"]
# Limite per test di pytest-timeout (dipendenza dev; anche nell'immagine di test e nella CI): un test bloccato si
# ferma con il suo stack invece di lasciare appesa la suite. Con MODELLER vero il test più lungo dura circa 45 s
# (rifinitura con OpenMM e riesecuzione del pacchetto, 4 core); il limite sta sopra le attese dei job nei test
# (wait_job, fino a 1200 s per job), così su un computer lento arriva prima il loro messaggio.
# Senza il plugin (Python di sistema) pytest dà solo l'avviso "Unknown config option: timeout".
timeout = 1800

# Copertura dei test (pytest-cov, dipendenza dev; nell'immagine di test e nella CI): `pytest --cov` misura il pacchetto
# makphi, righe eseguite su righe eseguibili. Nessuna soglia minima: il numero si legge nel riepilogo della CI.
[tool.coverage.run]
source = ["makphi"]

[tool.coverage.report]
skip_covered = true
precision = 1

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Errori reali (sintassi, nomi, import) e bug comuni. Esclusi: B008 (Depends() di FastAPI nei default),
# B904 (i messaggi AppError sostituiscono volutamente l'eccezione originale), B905 (zip senza strict).
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B904", "B905"]
