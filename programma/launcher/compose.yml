# MakPhi in Docker. Di solito lo avvia l'avviatore ("Avvia MakPhi"), che scrive le variabili in
# ../../.env.locale; su un server (dalla cartella di MakPhi): docker compose -f programma/launcher/compose.yml --env-file server.env up -d
#
# Variabili principali (tutte facoltative):
#   MAKPHI_PORT        porta sul computer (8765)
#   MAKPHI_BIND        127.0.0.1 = solo questo computer; 0.0.0.0 = rete (server, con MAKPHI_AUTH=on), ma in HTTP e
#                       con la porta che scavalca il firewall: meglio 127.0.0.1 dietro un reverse proxy HTTPS
#   MAKPHI_ALLOWED_HOSTS  senza MAKPHI_AUTH: nomi con cui aprire MakPhi oltre a localhost e 127.0.0.1 ("*" = tutti)
#   MAKPHI_DATA_PATH   cartella dati (progetti, risultati, licenze, database); predefinita ../../data (la cartella data accanto a programma)
#   UNICLUST_PATH       cartella (disco esterno) con UniClust30/UniRef30, qualunque versione → QMEAN locale
#   QMTL_PATH           cartella QMTL (facoltativa) → QMEANDisCo
#   MAKPHI_MAC         MAC del container (licenza ProSA II); l'avviatore lo legge da LicenseDB
#   COMPOSE_PROFILES    "qmean" per avviare il servizio QMEAN locale
# MAKPHI_VERSION (versione delle immagini) la esporta l'avviatore leggendola da programma/launcher/VERSION; i valori
# predefiniti qui sotto (per compose a mano) li tiene allineati programma/scripts/versione.sh.
# Nome uguale per tutte le copie di MakPhi (il volume cache con l'indice MMseqs2 non va perso): due copie sullo stesso
# computer userebbero gli stessi container, quindi gli avviatori ne avviano una alla volta.
name: makphi

services:
  makphi:
    image: makphi:${MAKPHI_VERSION:-5.0.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # senza valore: quello di MAKPHI_VERSION (ENV MAKPHI_IMAGE_VERSION e LABEL makphi.version dell'immagine);
        # se non è impostata vale il predefinito del Dockerfile, uguale a quello di image
        - MAKPHI_VERSION
    platform: linux/amd64
    init: true
    ports:
      - "${MAKPHI_BIND:-127.0.0.1}:${MAKPHI_PORT:-8765}:8765"
    mac_address: "${MAKPHI_MAC:-02:42:b1:00:00:01}"
    environment:
      MAKPHI_AUTH: "${MAKPHI_AUTH:-off}"
      MAKPHI_ACCESS_KEY: "${MAKPHI_ACCESS_KEY:-}"
      MAKPHI_ALLOWED_HOSTS: "${MAKPHI_ALLOWED_HOSTS:-}"   # header Host ammessi senza MAKPHI_AUTH (DNS rebinding)
      # solo con MAKPHI_AUTH=on: reverse proxy fidati, da cui X-Forwarded-For conta per il freno ai tentativi d'accesso
      MAKPHI_TRUSTED_PROXIES: "${MAKPHI_TRUSTED_PROXIES:-}"
      MAKPHI_ALLOW_SHUTDOWN: "${MAKPHI_ALLOW_SHUTDOWN:-1}"
      MODELLER_KEY: "${MODELLER_KEY:-}"
      MAKPHI_MODELLER_PYTHON: "${MAKPHI_MODELLER_PYTHON:-}"   # interprete con MODELLER (server); vuoto = automatico
      MAKPHI_QMEAN_URL: "${MAKPHI_QMEAN_URL:-}"   # http://qmean:8080 quando il profilo qmean è attivo
      MAKPHI_ESMFOLD_URL: "${MAKPHI_ESMFOLD_URL:-}"   # solo con MAKPHI_AUTH=on: servizio ESMFold; vuoto = pubblico
      # server di posta per l'avviso alla fine delle pipeline (vuoto = dal file licenses/posta.env della cartella dati)
      MAKPHI_SMTP_HOST: "${MAKPHI_SMTP_HOST:-}"
      MAKPHI_SMTP_PORT: "${MAKPHI_SMTP_PORT:-587}"
      MAKPHI_SMTP_SECURITY: "${MAKPHI_SMTP_SECURITY:-starttls}"
      MAKPHI_SMTP_USER: "${MAKPHI_SMTP_USER:-}"
      MAKPHI_SMTP_PASSWORD: "${MAKPHI_SMTP_PASSWORD:-}"
      MAKPHI_SMTP_FROM: "${MAKPHI_SMTP_FROM:-}"
      MAKPHI_PUBLIC_URL: "${MAKPHI_PUBLIC_URL:-}"
    volumes:
      - "${MAKPHI_DATA_PATH:-../../data}:/data"   # progetti e risultati: viaggiano con la cartella
      - scratch:/scratch                         # lavoro temporaneo dei calcoli, svuotato a ogni avvio
      - cache:/cache                             # indici ricostruibili locali a questo computer
    restart: "${MAKPHI_RESTART:-no}"

  qmean:
    profiles: ["qmean"]
    image: makphi-qmean:${MAKPHI_VERSION:-5.0.0}
    build:
      context: ../docker/qmean
    platform: linux/amd64
    init: true
    environment:
      QMEAN_MAX_SECONDS: "${QMEAN_MAX_SECONDS:-14400}"
      QMEAN_HHBLITS_CPU: "${QMEAN_HHBLITS_CPU:-}"         # vuoto = i processori del container (max 8)
      QMEAN_PARALLEL: "${QMEAN_PARALLEL:-1}"              # calcoli contemporanei (server con molta memoria)
      QMEAN_PROFILE_CACHE_GB: "${QMEAN_PROFILE_CACHE_GB:-10}"   # profili HHblits riusati per sequenza; 0 = no
    volumes:
      - "${UNICLUST_PATH:-./vuoto}:/uniclust_src:ro"   # cartella con una o più versioni di UniClust30/UniRef30
      - "${QMTL_PATH:-qmtl_vuota}:/qmtl:ro"
      - qmean_cache:/cache                              # copie locali degli indici e cs219 ricreati (HH-suite 2)
    restart: "${MAKPHI_RESTART:-no}"

volumes:
  scratch:
  cache:
  qmean_cache:
  qmtl_vuota:
